<!--
  Supabase → Authentication → Email Templates → Magic link
  Subject: Your XactScore sign-in code
-->
<!DOCTYPE html>
<html lang="en">
  <body style="margin:0;padding:0;background:#050506;font-family:Arial,Helvetica,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
      Your XactScore sign-in code is {{ .Token }}
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#050506;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;">
            <tr>
              <td style="padding:0 0 20px;text-align:center;">
                <img src="{{ .SiteURL }}/icons/icon-192.png" width="48" height="48" alt="XactScore" style="display:inline-block;border-radius:12px;" />
                <div style="margin-top:10px;color:#f7f7f8;font-size:22px;font-weight:800;letter-spacing:-0.04em;">XactScore</div>
              </td>
            </tr>
            <tr>
              <td style="background:#141416;border:1px solid #2a2a2e;border-radius:20px;padding:32px 28px;color:#f7f7f8;">
                <div style="height:4px;width:64px;background:#ff8a2b;border-radius:999px;margin-bottom:20px;"></div>
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.2;color:#ffffff;">Your sign-in code</h1>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#b8b8c0;">
                  Use this one-time code to sign in. It expires soon, so don't sit on it.
                </p>
                <div style="margin:0 0 24px;padding:18px 12px;background:#0b0b0c;border:1px solid #ff8a2b55;border-radius:16px;text-align:center;color:#ff8a2b;font-size:32px;font-weight:800;letter-spacing:0.28em;font-family:Georgia,'Times New Roman',serif;">
                  {{ .Token }}
                </div>
                <p style="margin:0 0 16px;font-size:13px;line-height:1.5;color:#8a8a93;">Or jump straight in:</p>
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="border-radius:12px;background:#ff8a2b;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:800;letter-spacing:0.06em;">
                        SIGN IN
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#8a8a93;">
                  If you did not try to sign in, you can ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 8px 0;text-align:center;color:#6f6f76;font-size:11px;">
                Call the scores. Own the table.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
