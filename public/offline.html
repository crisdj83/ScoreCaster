<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E2E8F0" />
    <title>XactScore — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
        background: #050506;
        color: #f7f7f8;
      }
      main {
        width: min(28rem, 100%);
        text-align: center;
        border: 1px solid rgb(255 255 255 / 0.1);
        background: rgb(255 255 255 / 0.05);
        border-radius: 1.25rem;
        padding: 2rem 1.5rem;
      }
      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        background: #0c0c0e;
        display: grid;
        place-items: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 800;
      }
      p {
        margin: 0 0 1.5rem;
        color: #9a9aa3;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        background: #ff8a2b;
        color: #0f0f10;
        font: inherit;
        font-weight: 700;
        padding: 0.7rem 1.2rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          <path d="M3.2 17h5.1l3.3 8.6L16.8 6.6l4.4 10.4H28.8" stroke="#ff8a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="25.6" cy="7" r="3.7" stroke="#ff8a2b" stroke-width="1.85"/>
          <circle cx="25.6" cy="7" r="1.4" fill="#ff8a2b"/>
        </svg>
      </div>
      <h1>You’re offline</h1>
      <p>XactScore needs a connection for live scores and predictions. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
